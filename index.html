<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>磁磚雲端物管 | 完整資產追蹤系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .modal-backdrop { background-color: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

<div id="root"></div>

<script>
    (function(){
        // ---------- Firebase 配置 (若無則自動降級為純 LocalStorage) ----------
        let firebaseConfig = null;
        let appId = 'tile-inventory-pro';
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
                appId = typeof __app_id !== 'undefined' ? __app_id : 'tile-inventory-pro';
            }
        } catch(e) { console.warn(e); }
        
        let auth, db;
        let syncStatus = 'local';
        const isFirebaseEnabled = !!(firebaseConfig && firebaseConfig.apiKey);
        if (isFirebaseEnabled) {
            try {
                const app = firebase.initializeApp(firebaseConfig);
                auth = firebase.auth(app);
                db = firebase.firestore(app);
                syncStatus = 'connecting';
                auth.signInAnonymously().catch(() => syncStatus = 'permission-denied');
            } catch(e) { console.error(e); }
        }

        // ---------- 全域狀態 ----------
        let materials = [];
        let locations = [];
        let categories = [];
        let partners = [];
        let transactions = [];
        let activeTab = 'dashboard';
        let searchTerm = '';
        
        // 模態框狀態
        let modals = {
            material: { open: false, editing: null },
            stock: { open: false, material: null, type: 'in' },
            category: false,
            location: false,
            partner: false
        };

        // ---------- 儲存核心 (LocalStorage + 雲端) ----------
        function saveToLocalStorage(key, data) {
            localStorage.setItem(`tile_${key}`, JSON.stringify(data));
        }

        async function safeSave(collection, data, id = null) {
            const timestamp = new Date().toISOString();
            const cleanData = { ...data, updatedAt: timestamp };
            let current = [];
            if (collection === 'materials') current = [...materials];
            else if (collection === 'locations') current = [...locations];
            else if (collection === 'categories') current = [...categories];
            else if (collection === 'partners') current = [...partners];
            else if (collection === 'transactions') current = [...transactions];
            
            let newArray;
            let docId = id;
            if (id) {
                newArray = current.map(item => item.id === id ? { ...item, ...cleanData } : item);
            } else {
                docId = Math.random().toString(36).substr(2, 9);
                newArray = [...current, { ...cleanData, id: docId, createdAt: timestamp }];
            }
            
            if (collection === 'materials') materials = newArray;
            else if (collection === 'locations') locations = newArray;
            else if (collection === 'categories') categories = newArray;
            else if (collection === 'partners') partners = newArray;
            else if (collection === 'transactions') transactions = newArray;
            
            saveToLocalStorage(collection, newArray);
            
            if (isFirebaseEnabled && db && syncStatus !== 'permission-denied') {
                try {
                    const path = ['artifacts', appId, 'public', 'data', collection];
                    const ref = db.collection(path.join('/'));
                    if (docId) await ref.doc(docId).set(cleanData, { merge: true });
                    else await ref.add(cleanData);
                } catch(err) { console.warn(err); }
            }
            render();
        }

        async function deleteItem(collection, id) {
            let current = [];
            if (collection === 'materials') current = materials;
            else if (collection === 'locations') current = locations;
            else if (collection === 'categories') current = categories;
            else if (collection === 'partners') current = partners;
            const newArray = current.filter(i => i.id !== id);
            if (collection === 'materials') materials = newArray;
            else if (collection === 'locations') locations = newArray;
            else if (collection === 'categories') categories = newArray;
            else if (collection === 'partners') partners = newArray;
            saveToLocalStorage(collection, newArray);
            if (isFirebaseEnabled && db) {
                try {
                    const path = ['artifacts', appId, 'public', 'data', collection];
                    await db.collection(path.join('/')).doc(id).delete();
                } catch(e) {}
            }
            render();
        }

        // 庫存調整
        function handleStockAdjust(amount, sourceDest, locationObj) {
            const { material, type } = modals.stock;
            const num = parseFloat(amount);
            if (isNaN(num) || num <= 0) return alert("請輸入有效數量");
            if (type === 'out' && num > material.stock) return alert("出庫數量超過當前庫存");
            const newStock = type === 'in' ? material.stock + num : material.stock - num;
            // 更新物料
            const updatedMat = { ...material, stock: newStock, locationId: locationObj.id, locationName: locationObj.name };
            safeSave('materials', updatedMat, material.id);
            // 新增交易
            const tx = {
                materialId: material.id,
                materialName: material.name,
                type: type,
                amount: num,
                priceAtTime: material.price || 0,
                unit: material.unit || '片',
                locationName: locationObj.name,
                sourceDestination: sourceDest,
                afterStock: newStock,
                timestamp: new Date().toISOString()
            };
            safeSave('transactions', tx);
            closeModals();
        }

        // ---------- UI 渲染引擎 ----------
        let root = null;
        function render() {
            if (!root) root = document.getElementById('root');
            if (!root) return;
            root.innerHTML = buildHTML();
            if (window.lucide) lucide.createIcons();
            bindEvents();
        }

        function bindEvents() {
            document.querySelectorAll('[data-action]').forEach(el => {
                el.removeEventListener('click', handleAction);
                el.addEventListener('click', handleAction);
            });
            const searchInput = document.getElementById('global-search');
            if (searchInput) {
                searchInput.value = searchTerm;
                searchInput.oninput = (e) => { searchTerm = e.target.value; render(); };
            }
            document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
                backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeModals(); });
            });
        }

        function handleAction(e) {
            const btn = e.currentTarget;
            const action = btn.dataset.action;
            if (!action) return;
            
            if (action === 'setTab') { activeTab = btn.dataset.tab; render(); }
            else if (action === 'openMaterialModal') {
                const editId = btn.dataset.editId;
                modals.material = { open: true, editing: editId ? materials.find(m => m.id === editId) : null };
                render();
            }
            else if (action === 'openStockModal') {
                const matId = btn.dataset.materialId;
                const type = btn.dataset.stockType;
                modals.stock = { open: true, material: materials.find(m => m.id === matId), type };
                render();
            }
            else if (action === 'confirmStock') {
                const amount = document.getElementById('stock_amount')?.value;
                const source = document.getElementById('stock_source')?.value;
                const locId = document.getElementById('stock_location')?.value;
                if (!amount || !source || !locId) return alert("請填寫完整");
                const loc = locations.find(l => l.id === locId);
                if (loc) handleStockAdjust(amount, source, loc);
            }
            else if (action === 'saveMaterial') {
                const name = document.getElementById('mat_name')?.value;
                if (!name) return alert("請輸入名稱");
                const editing = modals.material.editing;
                const form = {
                    name, category: document.getElementById('mat_category')?.value,
                    locationId: document.getElementById('mat_location')?.value,
                    locationName: locations.find(l => l.id === document.getElementById('mat_location')?.value)?.name || '',
                    batchNumber: document.getElementById('mat_batch')?.value,
                    length: parseFloat(document.getElementById('mat_length')?.value) || 0,
                    width: parseFloat(document.getElementById('mat_width')?.value) || 0,
                    stock: parseFloat(document.getElementById('mat_stock')?.value) || 0,
                    unit: document.getElementById('mat_unit')?.value,
                    price: parseFloat(document.getElementById('mat_price')?.value) || 0,
                };
                form.areaPerPiece = (form.length * form.width) / 10000;
                safeSave('materials', form, editing?.id);
                closeModals();
            }
            else if (action === 'openSimpleModal') {
                const type = btn.dataset.modalType;
                if (type === 'category') modals.category = true;
                else if (type === 'location') modals.location = true;
                else if (type === 'partner') modals.partner = true;
                render();
            }
            else if (action === 'saveSimple') {
                const name = document.getElementById('simple_name')?.value;
                const type = btn.dataset.saveType;
                if (!name) return alert("請輸入名稱");
                if (type === 'category') safeSave('categories', { name });
                else if (type === 'location') safeSave('locations', { name });
                else if (type === 'partner') safeSave('partners', { name });
                closeModals();
            }
            else if (action === 'deleteItem') {
                const col = btn.dataset.collection;
                const id = btn.dataset.id;
                if (confirm('確定刪除？')) deleteItem(col, id);
            }
            else if (action === 'closeModal') closeModals();
        }

        function closeModals() {
            modals = { material: { open: false, editing: null }, stock: { open: false, material: null, type: 'in' }, category: false, location: false, partner: false };
            render();
        }

        // 初始化資料
        function loadData() {
            materials = JSON.parse(localStorage.getItem('tile_materials') || '[]');
            locations = JSON.parse(localStorage.getItem('tile_locations') || '[]');
            categories = JSON.parse(localStorage.getItem('tile_categories') || '[]');
            partners = JSON.parse(localStorage.getItem('tile_partners') || '[]');
            transactions = JSON.parse(localStorage.getItem('tile_transactions') || '[]');
            if (locations.length === 0) { locations = [{ id: 'loc1', name: '總倉庫' }]; saveToLocalStorage('locations', locations); }
            if (categories.length === 0) { categories = [{ id: 'cat1', name: '石英磚' }]; saveToLocalStorage('categories', categories); }
            if (partners.length === 0) { partners = [{ id: 'par1', name: '建案A' }]; saveToLocalStorage('partners', partners); }
            if (materials.length === 0) {
                const sample = { id: 'mat1', name: '雅典灰', category: '石英磚', locationId: 'loc1', locationName: '總倉庫', batchNumber: 'B001', length: 60, width: 60, stock: 100, unit: '片', price: 280, areaPerPiece: 0.36 };
                materials = [sample]; saveToLocalStorage('materials', materials);
            }
            render();
        }

        // ----- HTML 建構 (完整版)-----
        function buildHTML() {
            const syncMsg = syncStatus === 'synced' ? '☁️ 雲端即時同步' : (syncStatus === 'connecting' ? '🔄 連線中' : '💾 本地模式');
            const navItems = [
                { id: 'dashboard', label: '營運概覽', icon: 'TrendingUp' },
                { id: 'inventory', label: '物料清單', icon: 'Package' },
                { id: 'categories', label: '分類編修', icon: 'Tags' },
                { id: 'locations', label: '倉庫管理', icon: 'Warehouse' },
                { id: 'partners', label: '往來單位', icon: 'Users' },
                { id: 'history', label: '入/出庫紀錄', icon: 'History' }
            ];
            const filteredMats = materials.filter(m => (m.name||'').toLowerCase().includes(searchTerm) || (m.batchNumber||'').toLowerCase().includes(searchTerm) || (m.locationName||'').toLowerCase().includes(searchTerm));
            
            return `
                <div class="min-h-screen flex flex-col md:flex-row">
                    <aside class="w-full md:w-72 bg-white dark:bg-slate-900 border-b md:border-r p-5 shrink-0">
                        <div class="flex items-center gap-3 mb-6"><div class="bg-blue-600 p-2 rounded-xl text-white"><i data-lucide="LayoutGrid"></i></div><div><h1 class="font-black">磁磚雲端物管</h1><p class="text-xs text-slate-400">Tile Asset Pro</p></div></div>
                        <div class="text-xs p-2 rounded mb-4 ${syncStatus === 'local' ? 'bg-amber-50' : 'bg-emerald-50'}">${syncMsg}</div>
                        ${navItems.map(item => `<button data-action="setTab" data-tab="${item.id}" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl mb-1 ${activeTab === item.id ? 'bg-blue-600 text-white' : 'hover:bg-slate-100'}"><i data-lucide="${item.icon}"></i>${item.label}</button>`).join('')}
                    </aside>
                    <main class="flex-1 p-6 md:p-8 overflow-auto">${renderMainContent(filteredMats)}</main>
                </div>
                ${renderModals()}
            `;
        }

        function renderMainContent(filteredMats) {
            if (activeTab === 'dashboard') return renderDashboard();
            if (activeTab === 'inventory') return renderInventory(filteredMats);
            if (activeTab === 'locations') return renderLocations();
            if (activeTab === 'categories') return renderCategories();
            if (activeTab === 'partners') return renderPartners();
            if (activeTab === 'history') return renderHistory();
            return '';
        }

        function renderDashboard() {
            const totalVal = materials.reduce((a,m)=> a + (m.stock*m.price || 0),0);
            const totalArea = materials.reduce((a,m)=> a + (m.stock * (m.areaPerPiece||0)),0);
            return `<div><h2 class="text-3xl font-black">營運概覽</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-4 my-6"><div class="bg-white p-5 rounded-2xl border-l-4 border-l-blue-600"><p class="text-slate-400 text-xs">總市值</p><p class="text-2xl font-black text-blue-600">$${totalVal.toLocaleString()}</p></div><div class="bg-white p-5 rounded-2xl"><p class="text-slate-400 text-xs">總面積</p><p class="text-2xl font-black">${totalArea.toFixed(1)} m²</p></div><div class="bg-white p-5 rounded-2xl"><p class="text-slate-400 text-xs">物料品項</p><p class="text-2xl font-black">${materials.length}</p></div><div class="bg-white p-5 rounded-2xl"><p class="text-slate-400 text-xs">低庫存</p><p class="text-2xl font-black text-rose-600">${materials.filter(m=>m.stock<10).length}</p></div></div><div class="bg-white p-5 rounded-2xl"><h3 class="font-bold mb-3">近期異動</h3>${transactions.slice(-5).reverse().map(t=>`<div class="flex justify-between py-2 border-b"><div><span class="text-xs font-bold">${t.materialName}</span><p class="text-xs text-slate-400">${t.sourceDestination}</p></div><span class="font-black ${t.type==='in'?'text-emerald-600':'text-rose-600'}">${t.type==='in'?'+':'-'}${t.amount}</span></div>`).join('')}</div></div>`;
        }
        
        function renderInventory(list) {
            return `<div><div class="flex justify-between flex-wrap gap-3 mb-6"><h2 class="text-2xl font-black">物料清單</h2><div class="flex gap-3"><div class="relative"><i data-lucide="Search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4"></i><input id="global-search" class="pl-9 pr-4 py-2 rounded-xl border" placeholder="搜尋"></div><button data-action="openMaterialModal" class="bg-blue-600 text-white px-4 py-2 rounded-xl flex gap-2"><i data-lucide="Plus"></i>新增物料</button></div></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">${list.map(m => `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border"><div class="flex justify-between"><span class="bg-blue-50 text-blue-700 text-xs px-2 py-0.5 rounded-full">${m.category||'未分類'}</span><button data-action="openMaterialModal" data-edit-id="${m.id}" class="text-slate-400"><i data-lucide="Edit3" size="14"></i></button></div><h3 class="font-black text-lg mt-2">${m.name}</h3><p class="text-xs flex gap-2 mt-1"><i data-lucide="Warehouse" size="12"></i>${m.locationName||'無'}<span class="bg-amber-50 px-1 rounded">批號:${m.batchNumber||'-'}</span></p><div class="flex justify-between mt-3"><div><p class="text-xs text-slate-400">庫存</p><p class="font-black">${m.stock} ${m.unit}</p></div><div><p class="text-xs text-slate-400">資產</p><p class="font-black text-blue-600">$${(m.stock*m.price).toLocaleString()}</p></div></div><div class="grid grid-cols-2 gap-2 mt-4"><button data-action="openStockModal" data-material-id="${m.id}" data-stock-type="out" class="border py-1.5 rounded-xl text-sm font-medium hover:bg-slate-50">出庫</button><button data-action="openStockModal" data-material-id="${m.id}" data-stock-type="in" class="bg-blue-600 text-white py-1.5 rounded-xl text-sm">入庫</button></div></div>
                `).join('')}</div></div>`;
        }
        
        function renderLocations() {
            return `<div><div class="flex justify-between mb-6"><h2 class="text-2xl font-black">倉庫管理</h2><button data-action="openSimpleModal" data-modal-type="location" class="bg-blue-600 text-white px-4 py-2 rounded-xl flex gap-2"><i data-lucide="Plus"></i>新增倉庫</button></div><div class="space-y-5">${locations.map(loc => {
                const locMats = materials.filter(m => m.locationId === loc.id);
                const totalVal = locMats.reduce((a,m)=> a + (m.stock*m.price),0);
                return `<div class="bg-white rounded-2xl p-5 border-t-4 border-t-blue-600"><div class="flex justify-between items-center"><div class="flex gap-3"><i data-lucide="Warehouse" class="text-blue-500"></i><div><h3 class="font-black text-xl">${loc.name}</h3><p class="text-xs text-slate-400">${locMats.length} 項物料</p></div></div><div><p class="text-sm font-bold">據點資產: $${totalVal.toLocaleString()}</p><button data-action="deleteItem" data-collection="locations" data-id="${loc.id}" class="text-rose-400 ml-4"><i data-lucide="Trash2" size="16"></i></button></div></div><div class="mt-4 overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-2 text-left">物料</th><th class="p-2 text-left">庫存</th><th class="p-2 text-right">價值</th></tr></thead><tbody>${locMats.map(m=>`<tr><td class="p-2">${m.name}</td><td class="p-2">${m.stock} ${m.unit}</td><td class="p-2 text-right">$${(m.stock*m.price).toLocaleString()}</td></tr>`).join('')}</tbody></table></div></div>`;
            }).join('')}</div></div>`;
        }
        
        function renderCategories() {
            return `<div><div class="flex justify-between mb-6"><h2 class="text-2xl font-black">分類編修</h2><button data-action="openSimpleModal" data-modal-type="category" class="bg-blue-600 text-white px-4 py-2 rounded-xl flex gap-2"><i data-lucide="Plus"></i>新增分類</button></div><div class="grid grid-cols-2 md:grid-cols-4 gap-4">${categories.map(cat => {
                const count = materials.filter(m => m.category === cat.name).length;
                return `<div class="bg-white p-4 rounded-2xl text-center relative group border hover:shadow-md"><i data-lucide="Tags" class="text-indigo-500 mx-auto"></i><p class="font-bold mt-2">${cat.name}</p><p class="text-xs text-slate-400">${count} 項物料</p><button data-action="deleteItem" data-collection="categories" data-id="${cat.id}" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-red-400"><i data-lucide="Trash2" size="14"></i></button></div>`;
            }).join('')}</div></div>`;
        }
        
        function renderPartners() {
            return `<div><div class="flex justify-between mb-6"><h2 class="text-2xl font-black">往來單位</h2><button data-action="openSimpleModal" data-modal-type="partner" class="bg-blue-600 text-white px-4 py-2 rounded-xl flex gap-2"><i data-lucide="Plus"></i>新增單位</button></div><div class="space-y-5">${partners.map(partner => {
                const relTx = transactions.filter(t => t.sourceDestination === partner.name);
                const totalSpent = relTx.reduce((s,t)=> s + (t.amount * t.priceAtTime),0);
                return `<div class="bg-white p-5 rounded-2xl border"><div class="flex justify-between items-center"><div class="flex gap-2"><i data-lucide="Users"></i><h3 class="font-black">${partner.name}</h3></div><div><span class="text-emerald-600 font-bold">累計往來 $${totalSpent.toLocaleString()}</span><button data-action="deleteItem" data-collection="partners" data-id="${partner.id}" class="text-rose-400 ml-4"><i data-lucide="Trash2" size="16"></i></button></div></div><div class="mt-3 text-sm"><table class="w-full"><thead><tr><th>物料</th><th>入庫</th><th>出庫</th><th>庫存</th></tr></thead><tbody>${(() => {
                    const agg = {};
                    relTx.forEach(t => { if(!agg[t.materialId]) agg[t.materialId] = { name: t.materialName, in:0, out:0, unit: t.unit };
                    if(t.type==='in') agg[t.materialId].in += t.amount;
                    else agg[t.materialId].out += t.amount; });
                    return Object.values(agg).map(g => `<tr><td class="p-1">${g.name}</td><td class="text-emerald-600">+${g.in}</td><td class="text-rose-600">-${g.out}</td><td class="font-black">${g.in - g.out} ${g.unit}</td></tr>`).join('');
                })()}</tbody></table></div></div>`;
            }).join('')}</div></div>`;
        }
        
        function renderHistory() {
            return `<div><h2 class="text-2xl font-black mb-4">完整出入庫紀錄</h2><div class="bg-white rounded-2xl overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 border-b"><tr><th class="p-3 text-left">時間</th><th class="p-3 text-left">物料</th><th class="p-3 text-center">類型</th><th class="p-3 text-left">地點</th><th class="p-3 text-left">往來單位</th><th class="p-3 text-right">數量</th><th class="p-3 text-right">餘額</th></tr></thead><tbody>${transactions.slice().reverse().map(t => `<tr class="border-b"><td class="p-3 text-xs text-slate-400">${new Date(t.timestamp).toLocaleString()}</td><td class="p-3 font-bold">${t.materialName}</td><td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-xs ${t.type==='in'?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700'}">${t.type==='in'?'入庫':'出庫'}</span></td><td class="p-3">${t.locationName}</td><td class="p-3 text-blue-600">${t.sourceDestination}</td><td class="p-3 text-right ${t.type==='in'?'text-emerald-600':'text-rose-600'} font-black">${t.type==='in'?'+':'-'}${t.amount}</td><td class="p-3 text-right font-mono">${t.afterStock}</td></tr>`).join('')}</tbody></table></div></div>`;
        }
        
        function renderModals() {
            let html = '';
            if (modals.material.open) html += `<div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4"><div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-2xl p-6 max-h-[90vh] overflow-auto"><h3 class="text-xl font-black mb-4">${modals.material.editing ? '編輯物料' : '新增物料'}</h3><div class="grid grid-cols-2 gap-4"><div><label>名稱</label><input id="mat_name" class="w-full border p-2 rounded" value="${modals.material.editing?.name || ''}"></div><div><label>分類</label><select id="mat_category" class="w-full border p-2 rounded"><option value="">無</option>${categories.map(c=>`<option ${modals.material.editing?.category === c.name ? 'selected' : ''} value="${c.name}">${c.name}</option>`).join('')}</select></div><div><label>倉庫</label><select id="mat_location" class="w-full border p-2 rounded"><option value="">未指定</option>${locations.map(l=>`<option ${modals.material.editing?.locationId === l.id ? 'selected' : ''} value="${l.id}">${l.name}</option>`).join('')}</select></div><div><label>批號</label><input id="mat_batch" value="${modals.material.editing?.batchNumber || ''}" class="w-full border p-2 rounded"></div><div><label>長(cm)</label><input id="mat_length" type="number" value="${modals.material.editing?.length || 60}" class="w-full border p-2 rounded"></div><div><label>寬(cm)</label><input id="mat_width" type="number" value="${modals.material.editing?.width || 60}" class="w-full border p-2 rounded"></div><div><label>庫存數量</label><input id="mat_stock" type="number" value="${modals.material.editing?.stock || 0}" class="w-full border p-2 rounded"></div><div><label>單位</label><select id="mat_unit" class="w-full border p-2 rounded"><option ${modals.material.editing?.unit === '片' ? 'selected' : ''}>片</option><option ${modals.material.editing?.unit === '箱' ? 'selected' : ''}>箱</option></select></div><div><label>單價</label><input id="mat_price" type="number" step="1" value="${modals.material.editing?.price || 0}" class="w-full border p-2 rounded"></div></div><div class="flex gap-3 mt-6"><button data-action="saveMaterial" class="bg-blue-600 text-white px-6 py-2 rounded-xl">儲存</button><button data-action="closeModal" class="border px-6 py-2 rounded-xl">取消</button></div></div></div>`;
            if (modals.stock.open) {
                const mat = modals.stock.material;
                html += `<div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md p-6"><div class="flex gap-2 items-center"><i data-lucide="${modals.stock.type === 'in' ? 'ArrowDownLeft' : 'ArrowUpRight'}" class="text-emerald-600"></i><h3 class="text-xl font-black">${modals.stock.type === 'in' ? '入庫' : '出庫'}：${mat.name}</h3></div><div class="my-4"><p>當前庫存: ${mat.stock} ${mat.unit}</p><label>往來單位</label><select id="stock_source" class="w-full border p-2 rounded"><option value="">請選擇</option>${partners.map(p=>`<option value="${p.name}">${p.name}</option>`).join('')}</select><label class="mt-2">倉庫</label><select id="stock_location" class="w-full border p-2 rounded">${locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select><label class="mt-2">數量</label><input id="stock_amount" type="number" class="w-full border p-2 rounded" placeholder="數量"></div><div class="flex gap-3"><button data-action="confirmStock" class="bg-blue-600 text-white px-4 py-2 rounded-xl w-full">確認異動</button><button data-action="closeModal" class="border px-4 py-2 rounded-xl w-full">取消</button></div></div></div>`;
            }
            if (modals.category) html += renderSimpleModalContent('category', '新增分類');
            if (modals.location) html += renderSimpleModalContent('location', '新增倉庫');
            if (modals.partner) html += renderSimpleModalContent('partner', '新增往來單位');
            return html;
        }
        
        function renderSimpleModalContent(type, title) {
            return `<div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-sm p-6"><h3 class="font-black text-xl mb-4">${title}</h3><input id="simple_name" class="w-full border p-3 rounded-xl" placeholder="請輸入名稱"><div class="flex gap-3 mt-6"><button data-action="saveSimple" data-save-type="${type}" class="bg-blue-600 text-white px-5 py-2 rounded-xl w-full">儲存</button><button data-action="closeModal" class="border px-5 py-2 rounded-xl w-full">取消</button></div></div></div>`;
        }
        
        loadData();
    })();
</script>
</body>
</html>
